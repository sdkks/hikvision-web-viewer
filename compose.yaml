services:
  camera-viewer:
    build:
      context: .
      dockerfile: Containerfile
    image: sdkks/hikvision-web-viewer:local
    container_name: hikvision-web-viewer
    restart: unless-stopped
    ports:
      - "8756:8756"
    env_file:
      - config.env
    environment:
      # Reachable from the LAN / other devices; credentials come from config.env.
      VIEWER_BIND: 0.0.0.0
      # Display timezone (container default is UTC): controls the times shown in
      # the UI and the day boundaries used by the recordings picker.
      TZ: Asia/Singapore
      # Weak NAS CPU? Prefer the 360p sub channel as the default live view:
      # VIEWER_DEFAULT_CHANNEL: "102"
      # Offline demo without a camera:
      # HIK_MOCK: "1"
      # Optional: describe the camera in a mounted JSON file instead of HIK_*
      # variables (see config.env.example). The file wins for the fields it
      # sets; HIK_* fills the rest.
      # VIEWER_CONFIG: /config/camera.json
    # Mount the camera file read-only when VIEWER_CONFIG is set above:
    # volumes:
    #   - ./camera.json:/config/camera.json:ro
