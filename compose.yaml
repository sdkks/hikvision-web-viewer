version: "3.8"

services:
  camera-viewer:
    build:
      context: .
      dockerfile: Containerfile
    container_name: hikvision-web-viewer
    restart: unless-stopped
    ports:
      - "8756:8756"
    env_file:
      - config.env
    # Optional overrides (config.env values are loaded first; these win):
    # environment:
    #   HIK_MOCK: "1"                  # built-in fixtures, no camera needed
    #   VIEWER_DEFAULT_CHANNEL: "102"  # weak NAS CPU? default to the 360p sub channel
