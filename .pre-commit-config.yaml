repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and imports
        entry: venv/bin/python -m ruff check .
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff format check
        entry: venv/bin/python -m ruff format --check .
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: unittest
        name: deterministic unittest suite
        entry: venv/bin/python -B -m unittest discover -s tests -v
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      - id: conventional-commit
        name: Conventional Commit subject
        entry: venv/bin/python scripts/validate_commit_msg.py
        language: system
        stages: [commit-msg]
        pass_filenames: true
