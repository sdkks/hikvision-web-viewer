# Run the viewer with the camera described by a JSON file instead of HIK_* variables.
#
# This file pulls the published image and never builds: the ghcr package is public, so no
# `docker login` is needed, and a small NAS never has to compile anything. For a build from
# source (a development machine) use compose.yaml instead.
#
#   podman compose -f compose.camera-json.yaml up -d --pull always     # or: docker compose
#
# ":edge" tracks main and moves with every push. To pin exactly what you tested, use the
# INDEX digest, which resolves on any architecture - the value shown as "Digest:" by
# `docker buildx imagetools inspect ghcr.io/sdkks/hikvision-web-viewer:edge`, e.g.:
#   image: ghcr.io/sdkks/hikvision-web-viewer@sha256:7fe7aecc9858fa2441d323b08fd0a86102e2405ab9b281e210c6d9a3491e7255
# Do NOT pin one of the "unknown/unknown" entries GitHub lists next to the tag: those are
# per-architecture build attestations, not images, and pulling one fails with "unsupported
# image-specific operation on artifact with type application/vnd.docker.attestation.manifest.v1+json".
#
# camera.json holds the camera password in plaintext and is gitignored, like config.env,
# which still supplies the viewer's own settings (bind, port, auth, TZ). The file wins for
# the camera fields it sets; if it disagrees with HIK_* in config.env, startup says so
# once. Use one file or the other, not both: they claim the same container name.
services:
  camera-viewer:
    image: ghcr.io/sdkks/hikvision-web-viewer:edge
    container_name: hikvision-web-viewer
    restart: unless-stopped
    ports:
      - "8756:8756"
    env_file:
      - config.env
    environment:
      # Reachable from the LAN / other devices; credentials come from camera.json.
      VIEWER_BIND: 0.0.0.0
      # Display timezone (container default is UTC): controls the times shown in the
      # UI and the day boundaries used by the recordings picker.
      TZ: Asia/Singapore
      # Describe the camera in a mounted JSON file instead of HIK_* variables.
      VIEWER_CONFIG: /config/camera.json
    volumes:
      - ./camera.json:/config/camera.json:ro
