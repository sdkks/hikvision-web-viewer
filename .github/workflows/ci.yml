name: CI

on:
  push:
    branches: [main]
    # Documentation, the licence and the environment/deployment files cannot change the gates,
    # so they do not spend runners. This is evaluated on what changed, not on the commit
    # message: a commit that touches anything else still runs the whole job, so a mislabelled
    # change can never skip the gates. Path filters do not apply to tag pushes.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "compose*.yaml"
      - "config.env.example"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "compose*.yaml"
      - "config.env.example"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Exact version, not a major alias: astral-sh/setup-uv publishes no moving
      # major tags, so "@v10" cannot resolve ("unable to find version v10").
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install python dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Format check
        run: uv run --frozen ruff format --check .

      - name: Static type check
        run: uv run --frozen python -m mypy --config-file pyproject.toml

      - name: Unit tests
        run: uv run --frozen python -B -m unittest discover -s tests -v

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Integration smoke (mock sessions, HLS segments, stop-on-demand)
        run: uv run --frozen bash scripts/ci-smoke.sh
